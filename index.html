<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureVote</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #loader {
      position: fixed; inset: 0;
      background: #0f172a;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s;
    }
    #loader.hide { opacity: 0; pointer-events: none; }
    .loader-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 900; color: #fff;
      box-shadow: 0 0 40px rgba(37,99,235,0.5);
      animation: pulse 1.5s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .loader-dots { display: flex; gap: 6px; }
    .loader-dots span {
      width: 8px; height: 8px;
      background: #2563eb; border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }
    .loader-dots span:nth-child(2) { animation-delay: .2s; }
    .loader-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes dot {
      0%,80%,100% { transform: scale(.6); opacity: .4; }
      40% { transform: scale(1); opacity: 1; }
    }
    #app { display: none; width: 100%; max-width: 420px; }
    #app.show { display: block; }
    .card {
      background: rgba(30,41,59,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #fff;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(37,99,235,0.35);
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 28px; line-height: 1.5; }
    .features { margin-bottom: 28px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .feat {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px;
      background: rgba(37,99,235,0.08);
      border: 1px solid rgba(37,99,235,0.15);
      border-radius: 12px;
    }
    .feat-icon {
      width: 34px; height: 34px; border-radius: 9px;
      background: rgba(37,99,235,0.18);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .feat-text { font-size: 13px; color: #94a3b8; line-height: 1.4; }
    .feat-text strong { display: block; color: #f1f5f9; font-size: 13px; margin-bottom: 1px; }
    .btn-google {
      width: 100%; padding: 14px;
      background: #fff; color: #1f2937;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      transition: all .2s;
    }
    .btn-google:hover { background: #f8fafc; transform: translateY(-1px); }
    .btn-google:active { transform: none; }
    .btn-google:disabled { opacity: .6; cursor: not-allowed; transform: none; }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
    .status {
      margin-top: 12px; padding: 11px 14px;
      border-radius: 10px; font-size: 13px; display: none;
    }
    .status.show { display: block; }
    .status.err { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.2); color: #fca5a5; }
    .status.ok  { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.2); color: #6ee7b7; }
    .status.inf { background: rgba(37,99,235,.1); border: 1px solid rgba(37,99,235,.2); color: #93c5fd; }
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: #475569; font-size: 12px;
    }
    .divider::before,.divider::after { content:''; flex:1; height:1px; background: rgba(255,255,255,0.08); }
    .join-row { display: flex; gap: 8px; }
    .inp {
      flex: 1; padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px; color: #f1f5f9; font-size: 15px;
      text-transform: uppercase; letter-spacing: 3px; outline: none;
      transition: border-color .2s;
    }
    .inp::placeholder { color: #475569; letter-spacing: 0; text-transform: none; }
    .inp:focus { border-color: #2563eb; }
    .btn-join {
      padding: 12px 18px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: background .2s;
    }
    .btn-join:hover { background: #1d4ed8; }
    .note { margin-top: 22px; font-size: 11px; color: #475569; line-height: 1.5; }
  </style>
</head>
<body>

<div id="loader">
  <div class="loader-logo">SV</div>
  <div class="loader-dots"><span></span><span></span><span></span></div>
</div>

<div id="app">
  <div class="card">
    <div class="logo">SV</div>
    <h1>SecureVote</h1>
    <p class="sub">Анонимное голосование для Таджикистана</p>
    <div class="features">
      <div class="feat">
        <div class="feat-icon">🔒</div>
        <div class="feat-text"><strong>Анонимно</strong>Голос защищён шифрованием SHA-256</div>
      </div>
      <div class="feat">
        <div class="feat-icon">✅</div>
        <div class="feat-text"><strong>Один раз</strong>С одного аккаунта — один голос</div>
      </div>
      <div class="feat">
        <div class="feat-icon">📊</div>
        <div class="feat-text"><strong>Live результаты</strong>Обновляются в реальном времени</div>
      </div>
    </div>

    <button class="btn-google" id="btnGoogle" onclick="loginWithGoogle()">
      <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Войти через Google
    </button>

    <div id="st" class="status"></div>

    <div class="divider">или</div>
    <div class="join-row">
      <input class="inp" type="text" id="pollCode" placeholder="Код ABC123" maxlength="6" />
      <button class="btn-join" onclick="joinPoll()">Войти</button>
    </div>
    <p class="note">🔐 Ваши данные зашифрованы. Идентификатор никогда не передаётся на сервер.</p>
  </div>
</div>

<script>
  const API = window.location.origin + '/api';
  const CID = '958043340271-2udqs3muep02uu7fbc3ut4n145avl7a7.apps.googleusercontent.com';

  window.addEventListener('load', checkAuth);

  async function checkAuth() {
    try {
      const r = await fetch(`${API}/auth/me`, { credentials: 'include' });
      if (r.ok) { window.location.replace('/dashboard.html'); return; }
    } catch(_) {}
    showApp();
  }

  function showApp() {
    const l = document.getElementById('loader');
    l.classList.add('hide');
    setTimeout(() => { l.style.display = 'none'; document.getElementById('app').classList.add('show'); }, 300);
  }

  let pollTimer = null;

  function loginWithGoogle() {
    const btn = document.getElementById('btnGoogle');
    btn.disabled = true;
    btn.textContent = 'Ожидаем подтверждения...';
    showSt('Выберите аккаунт Google в открывшемся окне', 'inf');

    // Строим URL для OAuth
    const redirectUri = encodeURIComponent(window.location.origin + '/api/auth/google/callback');
    const scope = encodeURIComponent('openid email profile');
    const authUrl = `https://accounts.google.com/o/oauth2/v2/auth`
      + `?client_id=${CID}&redirect_uri=${redirectUri}&response_type=code`
      + `&scope=${scope}&prompt=select_account`;

    // Открываем всплывающее окно (работает и на мобильных при клике пользователя)
    const w = 500, h = 600;
    const left = Math.max(0, (screen.width - w) / 2);
    const top = Math.max(0, (screen.height - h) / 2);
    const popup = window.open(authUrl, 'google_login', `width=${w},height=${h},left=${left},top=${top}`);

    if (!popup || popup.closed) {
      // Popup заблокирован — делаем обычный redirect
      showSt('Переходим на Google...', 'inf');
      window.location.href = authUrl;
      return;
    }

    // Опрашиваем каждые 500мс — закрылось ли окно или вошёл ли пользователь
    pollTimer = setInterval(async () => {
      try {
        // Если popup закрыт пользователем
        if (popup.closed) {
          clearInterval(pollTimer);
          // Проверяем — может успел войти
          const r = await fetch(`${API}/auth/me`, { credentials: 'include' });
          if (r.ok) {
            window.location.replace('/dashboard.html');
          } else {
            showSt('', '');
            resetBtn();
          }
          return;
        }

        // Проверяем URL popup — когда Google сделал redirect обратно
        try {
          const popupUrl = popup.location.href;
          if (popupUrl && popupUrl.includes('/api/auth/google/callback')) {
            // callback загружается в popup — ждём пока он обработается
          }
          if (popupUrl && (popupUrl.includes('/dashboard.html') || popupUrl.includes('logged_in=1'))) {
            // Успешно вошли!
            clearInterval(pollTimer);
            popup.close();
            window.location.replace('/dashboard.html');
          }
        } catch(e) {
          // cross-origin — popup на google.com, нормально
        }
      } catch(e) {}
    }, 500);
  }

  function resetBtn() {
    const btn = document.getElementById('btnGoogle');
    btn.disabled = false;
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>Войти через Google`;
  }

  function joinPoll() {
    const c = document.getElementById('pollCode').value.trim().toUpperCase();
    if (c.length < 4) { showSt('Введите правильный код', 'err'); return; }
    window.location.href = `/vote.html?code=${c}`;
  }
  document.getElementById('pollCode')?.addEventListener('keypress', e => { if(e.key==='Enter') joinPoll(); });

  function showSt(msg, type) {
    const el = document.getElementById('st');
    el.textContent = msg;
    el.className = type ? `status show ${type}` : 'status';
  }
</script>
</body>
</html>
